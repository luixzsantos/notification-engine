<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Engine — Dashboard</title>

  <style>
    :root {
      --bg: #1e1f22;
      --panel: #2b2d31;
      --input: #313338;
      --border: #1b1c1f;
      --text: #dbdee1;
      --text-bright: #f2f3f5;
      --muted: #949ba4;
      --hover: #35373c;

      --pending: #6d7178;
      --success: #4caf7d;
      --retrying: #d9a441;
      --dlq: #d9534f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    header h1 {
      font-size: 16px;
      margin: 0;
      color: var(--text-bright);
    }

    header a {
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
    }

    header a:hover {
      color: var(--text);
    }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .stat-card .value {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-bright);
    }

    .stat-card .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: var(--muted);
      margin-top: 4px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }

    select, button {
      background: var(--input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }

    select:hover, button:hover {
      background: var(--hover);
    }

    .toolbar .spacer {
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    tr:last-child td {
      border-bottom: none;
    }

    td.mono {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge.pending { background: rgba(109,113,120,.2); color: var(--pending); }
    .badge.success { background: rgba(76,175,125,.15); color: var(--success); }
    .badge.retrying { background: rgba(217,164,65,.15); color: var(--retrying); }
    .badge.dlq { background: rgba(217,83,79,.15); color: var(--dlq); }

    .error-cell {
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--dlq);
      font-size: 12px;
    }

    .retry-btn {
      padding: 4px 10px;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Notification Engine — Dashboard</h1>
    <a href="main.html">← enviar notificação</a>
  </header>

  <main>
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <select id="filter-status">
        <option value="">Todos os status</option>
        <option value="pending">Pending</option>
        <option value="success">Success</option>
        <option value="retrying">Retrying</option>
        <option value="dlq">DLQ</option>
      </select>

      <select id="filter-channel">
        <option value="">Todos os canais</option>
        <option value="discord">Discord</option>
        <option value="telegram">Telegram</option>
        <option value="email">Email</option>
        <option value="webhook">Webhook</option>
      </select>

      <div class="spacer"></div>

      <button id="refresh-btn">Atualizar</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Canal</th>
          <th>Status</th>
          <th>Tentativas</th>
          <th>Último erro</th>
          <th>Criado em</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>

  <script>
    const API_URL = "http://localhost:8080";

    const statsEl = document.getElementById("stats");
    const rowsEl = document.getElementById("rows");
    const statusFilter = document.getElementById("filter-status");
    const channelFilter = document.getElementById("filter-channel");

    function fmtDate(iso) {
      return new Date(iso).toLocaleString("pt-BR");
    }

    function shortId(id) {
      return id.slice(0, 8) + "…";
    }

    async function loadStats() {
      const res = await fetch(`${API_URL}/api/v1/stats`);
      const s = await res.json();

      statsEl.innerHTML = `
        <div class="stat-card"><div class="value">${s.total}</div><div class="label">Total</div></div>
        <div class="stat-card"><div class="value">${s.pending}</div><div class="label">Pending</div></div>
        <div class="stat-card"><div class="value">${s.success}</div><div class="label">Success</div></div>
        <div class="stat-card"><div class="value">${s.retrying}</div><div class="label">Retrying</div></div>
        <div class="stat-card"><div class="value">${s.dlq}</div><div class="label">DLQ</div></div>
      `;
    }

    async function loadList() {
      const params = new URLSearchParams({ limit: "50" });
      if (statusFilter.value) params.set("status", statusFilter.value);
      if (channelFilter.value) params.set("channel", channelFilter.value);

      const res = await fetch(`${API_URL}/api/v1/notifications?${params}`);
      const items = await res.json();

      if (!items || items.length === 0) {
        rowsEl.innerHTML = `<tr><td colspan="7" class="empty">Nenhuma notificação encontrada.</td></tr>`;
        return;
      }

      rowsEl.innerHTML = items.map(n => `
        <tr>
          <td class="mono" title="${n.id}">${shortId(n.id)}</td>
          <td>${n.channel}</td>
          <td><span class="badge ${n.status}">${n.status}</span></td>
          <td>${n.attempts}/${n.max_attempts}</td>
          <td class="error-cell" title="${n.last_error || ""}">${n.last_error || "—"}</td>
          <td>${fmtDate(n.created_at)}</td>
          <td>${(n.status === "retrying" || n.status === "dlq")
            ? `<button class="retry-btn" data-id="${n.id}">Retry</button>`
            : ""}</td>
        </tr>
      `).join("");

      rowsEl.querySelectorAll(".retry-btn").forEach(btn => {
        btn.addEventListener("click", () => retry(btn.dataset.id));
      });
    }

    async function retry(id) {
      const res = await fetch(`${API_URL}/api/v1/notifications/${id}/retry`, { method: "POST" });
      if (!res.ok) {
        const data = await res.json();
        alert("Falha ao reenfileirar: " + (data.error || "erro desconhecido"));
        return;
      }
      refresh();
    }

    function refresh() {
      loadStats();
      loadList();
    }

    document.getElementById("refresh-btn").addEventListener("click", refresh);
    statusFilter.addEventListener("change", refresh);
    channelFilter.addEventListener("change", refresh);

    refresh();
    setInterval(refresh, 15000);
  </script>

</body>

</html>
